name: Base64String 1.3.0 candidate checks
on:
  push:
    branches: [prepare/base64string-1.3.0, base64String/release/latest]
  pull_request:
    branches: [base64String/release/latest]
permissions:
  contents: read
jobs:
  candidate:
    # Pin the reusable workflow to a commit so candidate checks cannot change unexpectedly.
    uses: stadub/PowershellScripts/.github/workflows/validate-release-candidate.yml@48556064087652ae6fc24d6255a117486b9b13f9
    with:
      module: Base64String
      version: '1.3.0'
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      automation_sha: 48556064087652ae6fc24d6255a117486b9b13f9
