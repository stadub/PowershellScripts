name: Base64String 1.3.0 candidate checks
on:
  push:
    branches: [prepare/base64string-1.3.0]
  pull_request:
    branches: [base64String/release/latest]
permissions:
  contents: read
jobs:
  candidate:
    uses: stadub/PowershellScripts/.github/workflows/validate-release-candidate.yml@a17b6e2fb9d22b2763ea7f7d05e84aa137dcadb7
    with:
      module: Base64String
      version: '1.3.0'
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      automation_sha: a17b6e2fb9d22b2763ea7f7d05e84aa137dcadb7
